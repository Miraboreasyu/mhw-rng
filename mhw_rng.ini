; ============================================================================
; MHW Universal RNG Microkernel (mhw_rng.ini)
; 路径: nativePC\plugins\mhw_rng.ini  (UTF-8)
; 子插件目录: nativePC\plugins\mhw_rng\*.dll (支持游戏内免重启热重载！)
; ============================================================================

[General]
; 微内核总开关
Enabled = true

; 启动游戏时立即开启全局确定性随机数接管
TakeoverOnBoot = true

; 启动后自动加载 nativePC\plugins\mhw_rng\*.dll 下的全部业务插件
AutoLoadPlugins = true

; 全局初始总种子 (十进制或 0x 十六进制)
MasterSeed = 12345

; 执行 $rng 指令时在聊天框回显中文反馈
ShowChatFeedback = true

; 统一命令前缀（所有核心与子插件指令均收口在 $rng 下，绝不污染其它 Mod 前缀！）
;   [微内核指令]
;     $rng                     -> 查看内核、插件与当前激活规则状态
;     $rng help                -> 列出核心指令 + 当前所有已加载插件注册的子指令
;     $rng plugins             -> 查看已加载的子插件列表
;     $rng reload [插件名]     -> 免重启热更新单个插件 DLL (如 `$rng reload size`) 或重载全部
;     $rng load / unload <名>  -> 动态加载或卸载指定子插件
;     $rng on / off / observe  -> 全局接管开 / 关(直通) / 仅观测(不改结果)
;     $rng seed <num>          -> 切换全局总种子并重置轮次
;     $rng reset               -> 重置所有随机流回起点 & 清零本轮计数
;     $rng save/restore/saves -> 内存 RNG 状态快照保存 / 恢复 / 列表
;     $rng rawfix <0xRVA> <u32> [condId] -> 底层原始地址/条件槽注入
;
;   [怪物体型插件 rng_size.dll]
;     $rng size                -> 查看当前体型策略 + 最近刷出怪物的任务表范围与实际体型%
;     $rng size min / max / mid-> 全局必出最小(小金) / 最大(大金) / 标准体型
;     $rng size <0~100>        -> 按 0~100 权重轴固定抽取
;     $rng size exact <88~125> -> 实时读取当前任务的 38 档 cSizeTable 反算对应体型%的精确随机数
;     $rng size rajang max     -> 按怪物条件枚举(CondEnum)只锁金狮子大金，同场其它怪保持正常随机！
;     $rng size clear          -> 清空体型规则
;
;   [全量词典探针插件 rng_inspector.dll]
;     $rng top [N|all]         -> 列出本轮触发最多的核心玩法随机点 (#1..#N)
;     $rng find <kw>           -> 按英文关键词搜索 1,697 处随机点
;     $rng names / list / info -> 英文短词表 / 激活列表 / 单点详情
;     $rng dump                -> 导出三段式中文详表到 nativePC\plugins\mhw_rng_dump.txt
ChatPrefix = $rng

[Hotkeys]
; 可选快捷键 (默认 0 关闭)
KeyToggleTakeover = 0
KeyResetEpoch = 0

[SlotOverrides]
; 底层微内核开机静态规则 (仅接受纯数值 0xRVA，支持可选 `:condId` 条件号，域名逻辑请交由子插件处理)
; 示例:
; 0x169BA15 = fixed:0
; 0x169BA15:24 = fixed:0xFFFFFF00
