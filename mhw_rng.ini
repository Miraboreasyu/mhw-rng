; ============================================================================
; MHW Universal RNG Microkernel (mhw_rng.ini)
; 路径: nativePC\plugins\mhw_rng.ini  (UTF-8)
; 子插件目录: nativePC\plugins\mhw_rng\*.dll (支持游戏内热重载)
; ============================================================================

[General]
; 微内核总开关
Enabled = true

; 启动运行模式:
;   selective = 按需接管（默认推荐：仅控制已设规则或插件挂钩点位，其余游戏随机与存档种子 100% 保持原版）
;   takeover  = 全局确定性接管（所有玩法调用点按总种子派生；受 ProtectSaveSeeds 保护的点位仍保持原版）
;   observe   = 仅观测（100% 原版随机，仅记录统计与蒸汽机按键提示）
;   off       = 关闭
BootMode = selective

; 在全局 takeover 模式下自动保护存档持久化种子推进器（猫饭/炼金/鉴定/赤龙觉醒等），防止改写存档原始种子链
; 如需主动控制这些存档表点位，可设为 false，或在 [SlotOverrides] / 插件中显式覆盖对应 RVA
ProtectSaveSeeds = true

; 启动后自动加载 nativePC\plugins\mhw_rng\*.dll 下的子插件
AutoLoadPlugins = true

; 全局初始总种子 (十进制或 0x 十六进制)
MasterSeed = 12345

; 启用游戏内内置命令行终端叠加窗口 (支持 DX11/DX12/HDR、readline 快捷键与插件 Tab 自动补全)
; 默认按 ` / ~ 键呼出，命令行内可直接输入指令 (如 `status` / `size rajang max`)，无需加 $rng 前缀
ConsoleEnabled = true

; 执行指令/插件通知是否同时同步显示到 MHW 原版聊天框 (默认 false：仅在内置终端显示，避免原版聊天框刷屏；设为 true 或执行 `chat on` 可恢复同步)
ShowChatFeedback = false
Language = zh

; 可选启动后自动执行的命令脚本文件 (默认留空；相对 nativePC\plugins\mhw_rng\ 或 nativePC\plugins\ 路径，如 autoexec.txt)
; 支持脚本内换行写长命令及省略 $rng 前缀，突破游戏聊天框 128 字节限制；也可随时用 `$rng exec <file>` 手动执行
AutoExec = 

; 统一命令前缀（所有核心与子插件指令均挂载在 $rng 下）
;   [微内核指令]
;     $rng                     -> 查看内核、插件与当前激活规则状态
;     $rng help                -> 列出核心指令与当前已加载插件的子指令
;     $rng plugins             -> 查看已加载的子插件列表
;     $rng reload [插件名|all|ini] -> 热更新单个插件 / 重载配置与全部插件 (默认保留当前运行模式，加 ini 强制恢复 BootMode)
;     $rng load / unload <名>  -> 动态加载或卸载指定子插件
;     $rng selective / on / off / observe -> 按需接管 / 全局接管 / 关(原版) / 仅观测
;     $rng lang [zh|en]        -> 查看或实时切换聊天框显示语言 (简体中文 / English)
;     $rng exec <file> [quiet] -> 从脚本文件批量执行命令 (每行一条，支持 # 或 ; 注释)
;     $rng seed <num>          -> 切换全局总种子并重置轮次
;     $rng reset               -> 重置所有随机流回起点 & 清零本轮计数
;     $rng save/restore/saves  -> 内存 RNG 状态快照保存 / 恢复 / 列表
;     $rng rawfix <0xRVA> <u32> [condId]               -> 底层原始地址/条件槽固定值注入
;     $rng rawseq <0xRVA> <v1,v2,...> [loop|hold|prng] -> 底层原始地址/条件槽序列注入
;
;   [怪物体型插件 rng_size.dll]
;     $rng size                -> 查看当前体型策略与最近刷出怪物的任务表范围/实际体型%
;     $rng size min / max / mid-> 全局固定为最小(小金) / 最大(大金) / 标准体型
;     $rng size <0~100>        -> 按 0~100 权重轴固定抽取
;     $rng size exact <88~125> -> 实时读取当前任务的 38 档 cSizeTable 反算对应体型%
;     $rng size rajang max     -> 按怪物条件枚举只锁金狮子大金，同场其它怪物不受影响
;     $rng size clear          -> 清空体型规则
;
;   [环境生物尺寸插件 rng_endemic.dll]
;     $rng endemic [ecXXX] <min|normal|max|exact 1.2x|clear> -> 控制环境生物大小金或精确尺寸
;
;   [通用 THK 控招插件 rng_thk.dll]
;     $rng thk status|probe|nodes|stats|rule|seq|preset -> THK 随机节点探测、计数与预设控招
;     $rng fatalis on|off|status|far|guards -> 黑龙 P1 二足+四足纯 RNG 预设快捷入口
;
;   [蒸汽机插件 rng_steam.dll]
;     $rng steam [on|off|verbose [on|off]|style kb|lock [awd|off]|pity on|reset] -> 按键提示与可选锁序
;
;   [全量词典探针插件 rng_inspector.dll]
;     $rng top [N|all]         -> 列出本轮触发最多的核心玩法随机点 (#1..#N)
;     $rng find <kw>           -> 按英文关键词搜索 1,697 处随机点
;     $rng names / list / info -> 英文短词表 / 激活列表 / 单点详情
;     $rng dump                -> 导出三段式中文详表到 nativePC\plugins\mhw_rng_dump.txt
ChatPrefix = $rng

[Hotkeys]
; 打开/关闭内置命令行终端窗口的快捷键 (默认 ` / ~ 即 VK_OEM_3；设为 0 关闭)
KeyToggleConsole = ~
; 可选快捷键 (默认 0 关闭)
KeyToggleTakeover = 0
KeyResetEpoch = 0

[SlotOverrides]
; 底层微内核开机静态规则 (仅接受纯数值 0xRVA，支持可选 `:condId` 条件号，域名逻辑请交由子插件处理)
; 示例:
; 0x169BA15 = fixed:0
; 0x169BA15:24 = fixed:0xFFFFFF00
